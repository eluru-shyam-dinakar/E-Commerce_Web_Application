<!DOCTYPE html>
<html>
<head>
  <title>Student Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dcfce7, #dbeafe);
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      color: #15803d;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
    }

    .submit-btn {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-btn {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Details</h2>

    <form id="studentForm">
      <label>Name:</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label>Email:</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label>User Name:</label>
      <input type="text" id="username" placeholder="Enter your username" required>

      <label>Password:</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <label>Course:</label>
      <input type="text" id="course" placeholder="Enter your course" required>

      <button type="submit" class="submit-btn">Continue</button>
    </form>

    <a href="index.html" class="back-btn">Back to Login</a>
  </div>

  <script>
    const form = document.getElementById('studentForm');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const student = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        course: document.getElementById('course').value
      };

      let students = JSON.parse(localStorage.getItem('studentLibrary') || '[]');
      students.push(student);
      localStorage.setItem('studentLibrary', JSON.stringify(students));

      alert('Student details saved successfully!');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
