<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f3e8ff, #dbeafe);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 900px;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      color: #6d28d9;
      margin-bottom: 20px;
    }

    .login-box {
      max-width: 400px;
      margin: 0 auto;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
    }

    button {
      width: 100%;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background: #ede9fe;
    }

    .logout {
      display: inline-block;
      margin-top: 20px;
      background: #dc2626;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginSection">
      <h2>Admin Login</h2>
      <div class="login-box">
        <form id="adminForm">
          <label>Email:</label>
          <input type="email" id="adminEmail" placeholder="Enter admin email" required>

          <label>Password:</label>
          <input type="password" id="adminPassword" placeholder="Enter admin password" required>

          <button type="submit">Login as Admin</button>
        </form>
      </div>
    </div>

    <div id="adminSection" style="display:none;">
      <h2>Saved Student Library</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>User Name</th>
            <th>Password</th>
            <th>Course</th>
          </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
      </table>
      <a href="index.html" class="logout">Back to Student Login</a>
    </div>
  </div>

  <script>
    const ADMIN_EMAIL = 'admin@gmail.com';
    const ADMIN_PASSWORD = 'admin123';

    const loginSection = document.getElementById('loginSection');
    const adminSection = document.getElementById('adminSection');
    const adminForm = document.getElementById('adminForm');
    const studentTableBody = document.getElementById('studentTableBody');

    function isLoggedIn() {
      return sessionStorage.getItem('adminLoggedIn') === 'true';
    }

    function showStudentTable() {
      const students = JSON.parse(localStorage.getItem('studentLibrary') || '[]');
      studentTableBody.innerHTML = '';

      if (students.length === 0) {
        studentTableBody.innerHTML = '<tr><td colspan="5">No saved student data found.</td></tr>';
        return;
      }

      students.forEach(student => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${student.name || '-'}</td>
          <td>${student.email || '-'}</td>
          <td>${student.username || '-'}</td>
          <td>${student.password || '-'}</td>
          <td>${student.course || '-'}</td>
        `;
        studentTableBody.appendChild(row);
      });
    }

    if (isLoggedIn()) {
      loginSection.style.display = 'none';
      adminSection.style.display = 'block';
      showStudentTable();
    }

    adminForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;

      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        sessionStorage.setItem('adminLoggedIn', 'true');
        loginSection.style.display = 'none';
        adminSection.style.display = 'block';
        showStudentTable();
      } else {
        alert('Invalid admin email or password');
      }
    });
  </script>
</body>
</html>
