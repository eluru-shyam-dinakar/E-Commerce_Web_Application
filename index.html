<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #fef3c7);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      width: 420px;
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      color: #1d4ed8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: 0.3s ease;
    }

    .login-btn {
      background: #2563eb;
    }

    .signup-btn {
      background: #16a34a;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .admin-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #7c3aed;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Student Login</h2>

    <form action="user.html" method="get">
      <label>Email:</label>
      <input type="email" name="email" placeholder="Enter your email" required>

      <label>User Name:</label>
      <input type="text" name="username" placeholder="Enter username" required>

      <label>Password:</label>
      <input type="password" name="password" placeholder="Enter password" required>

      <div class="buttons">
        <button type="submit" class="login-btn">Login</button>
        <button type="submit" class="signup-btn" formaction="user.html">Sign Up</button>
      </div>
    </form>

    <a href="admin.html" class="admin-link">Admin Login</a>
  </div>
</body>
</html>
